name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.webmanifest www/
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add native save plugin
        run: |
          mkdir -p android/app/src/main/java/com/loner63/auranotes
          cp native/*.java android/app/src/main/java/com/loner63/auranotes/
      - name: Allow microphone
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-notes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
