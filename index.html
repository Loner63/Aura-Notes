<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f12"><title>Aura Notes</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/styles.css"></head><body>
<div id="home" class="sr show">
 <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" fill="none"><ellipse cx="16" cy="16" rx="14" ry="6" transform="rotate(-24 16 16)" stroke="#a78bfa" stroke-width="1.4" opacity=".7"/><path d="M8 25 16 6l8 19M11.5 18h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>AURA NOTES</div>
 <h1 id="greet">Good evening.</h1><p class="sub">Write without limits.</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="pri" id="newNb">+ New notebook</button><button id="bk">Backup</button><button id="ipdf">Import PDF</button><button id="rs">Restore</button><button id="thm">Theme</button><input type="file" id="pdfi" accept="application/pdf" hidden><input type="file" id="rsf" accept=".json" hidden></div><input id="q" type="search" placeholder="Search notebooks, pages, typed text, tags" aria-label="Search" style="margin-top:18px;width:100%;max-width:520px;background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;min-height:44px">
 <div class="lab">NOTEBOOKS</div><div id="list"></div><div id="su" class="pill" style="margin-top:28px"></div>
</div>
<div id="ed" class="sr">
 <div class="bar">
  <button id="back">Back</button><button id="nm" style="max-width:180px;overflow:hidden;text-overflow:ellipsis"></button><span class="sp"></span>
  <button data-t="pen">Pen</button><button data-t="pencil">Pencil</button><button data-t="marker">Marker</button><button data-t="highlighter">Highlighter</button><button data-t="eraser">Eraser</button><button data-t="area">Area eraser</button><button data-t="lasso">Lasso</button><button data-t="text">Text</button><button data-t="table">Table</button><button data-t="image">Image</button><button id="rl">Ruler</button><button id="pr">Protractor</button><button id="sq">Set square</button><button data-t="line">Line</button><button data-t="rect">Rect</button><button data-t="ellipse">Ellipse</button><button data-t="triangle">Triangle</button>
  <span class="sp"></span><button id="fm">Focus</button><button id="un">Undo</button><button id="re">Redo</button>
 </div>
 <div class="opt" id="opt">
  <span id="cols" style="display:flex;gap:8px;align-items:center"></span><input type="color" id="cc" value="#1a1a22" aria-label="Custom colour">
  <span class="pill">Size</span><input type="range" id="sz" min="1" max="20" value="3"><span class="pill">Opacity</span><input type="range" id="op" min="15" max="100" value="100">
  <span id="rinfo" class="pill"></span><span id="tbb" style="display:none;gap:6px"><button id="tra">+ Row</button><button id="tca">+ Col</button><button id="trd">- Row</button><button id="tcd">- Col</button><button id="tcw">Wider</button><button id="tcn">Narrower</button><button id="trt">Taller</button><button id="trs">Shorter</button><button id="tsh">Shade</button><button id="tmr">Merge right</button><button id="tmd">Merge down</button><button id="tsp">Split</button><button id="tdl">Delete table</button></span><span id="imb" style="display:none;gap:6px"><button id="irt">Rotate</button><button id="icr">Crop</button><button id="idp">Duplicate</button><button id="idl">Delete</button></span><span id="selb" style="display:none;gap:6px"><button id="stb">To table</button><button id="sdup">Duplicate</button><button id="sdel">Delete</button></span>
  <span class="sp"></span>
  <button id="bm">Bookmark</button><button id="tg">Tags</button><button id="pgs">Pages</button><span class="pill" id="pn"></span><button id="dp">Delete</button>
  <button id="psz">Page size</button><select id="tp"><option value="blank">Blank</option><option value="ruled">Ruled</option><option value="grid">Grid</option><option value="dot">Dot grid</option><option value="cornell">Cornell</option><option value="graph">Graph paper</option><option value="math">Mathematics</option><option value="check">Checklist</option></select>
  <button id="pp">Paper</button><button id="fit">Fit</button><button id="ex">Export PNG</button><button id="xp">Export PDF</button>
 </div>
 <div id="stage"><canvas id="cv"></canvas></div>
</div>
<input type="file" id="imf" accept="image/*" hidden><div id="toast" role="status"></div>
<script src="js/app.js"></script></body></html>
